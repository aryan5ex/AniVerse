<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>AniVerse - Watch</title>

<link
    rel="stylesheet"
    href="style.css">


<style>

.watch-page{
    max-width:1100px;
    margin:auto;
}

.player{
    width:100%;
    aspect-ratio:16/9;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
}

.player-message{
    text-align:center;
    padding:20px;
}

.player-icon{
    font-size:42px;
    margin-bottom:10px;
}

.player-title{
    font-size:15px;
    font-weight:bold;
}

.player-sub{
    color:#777983;
    font-size:10px;
    margin-top:6px;
}

.watch-content{
    padding:18px 15px 40px;
}

.watch-title{
    font-size:20px;
    font-weight:900;
}

.watch-meta{
    color:#85868e;
    font-size:11px;
    margin-top:6px;
}

.episode-heading{
    font-size:17px;
    font-weight:bold;
    margin-top:25px;
    margin-bottom:12px;
}

.episode-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:8px;
}

.episode{
    height:40px;
    background:#18191f;
    border:1px solid #272831;
    border-radius:6px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#aaa;
    font-size:12px;
    text-decoration:none;
}

.episode.active{
    background:#9b5cff;
    color:white;
    border-color:#9b5cff;
}

.note{
    margin-top:22px;
    padding:13px;
    background:#131419;
    border:1px solid #202129;
    border-radius:8px;
    color:#85868e;
    font-size:11px;
    line-height:18px;
}

.back-top{
    display:inline-block;
    margin-top:15px;
    color:#b993ff;
    text-decoration:none;
    font-size:12px;
}

@media(max-width:420px){

    .episode-grid{
        grid-template-columns:repeat(4,1fr);
    }

}

</style>

</head>


<body>


<!-- HEADER -->

<header>

    <a
        href="index.html"
        class="back">

        &#8592;

    </a>

    <div class="logo">
        Ani<span>Verse</span>
    </div>

</header>


<main class="watch-page">


    <!-- PLAYER -->

    <div class="player">

        <div class="player-message">

            <div class="player-icon">
                ▶
            </div>

            <div
                id="playerTitle"
                class="player-title">

                AniVerse Player

            </div>

            <div class="player-sub">

                Episode player

            </div>

        </div>

    </div>


    <!-- CONTENT -->

    <div class="watch-content">


        <div
            id="watchTitle"
            class="watch-title">

            Loading...

        </div>


        <div
            id="watchMeta"
            class="watch-meta">

        </div>


        <!-- EPISODES -->

        <div class="episode-heading">
            Episodes
        </div>


        <div
            id="episodeGrid"
            class="episode-grid">

            <div class="loading">
                Loading episodes...
            </div>

        </div>


        <div class="note">

            Select an episode from the list above.

            <br><br>

            AniVerse player connection can be
            added later when a legal video source
            is available.

        </div>


        <a
            href="index.html"
            class="back-top">

            &#8592; Back to Home

        </a>


    </div>

</main>


<script>

const params =
    new URLSearchParams(
        window.location.search
    );


const animeId =
    params.get("id");


const episode =
    parseInt(
        params.get("ep") || "1"
    );


const titleElement =
    document.getElementById(
        "watchTitle"
    );


const metaElement =
    document.getElementById(
        "watchMeta"
    );


const playerTitle =
    document.getElementById(
        "playerTitle"
    );


const episodeGrid =
    document.getElementById(
        "episodeGrid"
    );


/* =========================
   LOAD ANIME
========================= */

async function loadAnime(){

    if(!animeId){

        titleElement.textContent =
            "Anime not found";

        episodeGrid.innerHTML =
            "";

        return;

    }


    try{

        const response =
            await fetch(
                "https://api.jikan.moe/v4/anime/" +
                animeId
            );


        if(!response.ok){

            throw new Error(
                "API Error"
            );

        }


        const result =
            await response.json();


        const anime =
            result.data;


        const totalEpisodes =
            anime.episodes || 1;


        titleElement.textContent =
            anime.title ||
            "Unknown Anime";


        metaElement.textContent =
            "Episode " +
            episode +
            " • " +
            (anime.type || "TV") +
            " • " +
            (anime.status || "");


        playerTitle.textContent =
            (anime.title || "Anime") +
            " - Episode " +
            episode;


        createEpisodes(
            totalEpisodes
        );


        document.title =
            "AniVerse - " +
            (anime.title || "Watch");


    }catch(error){

        console.log(error);

        titleElement.textContent =
            "Unable to load anime";

        episodeGrid.innerHTML =
            '<div class="error">' +
            'Anime information load nahi ho paayi.' +
            '</div>';

    }

}


/* =========================
   EPISODES
========================= */

function createEpisodes(total){

    episodeGrid.innerHTML =
        "";


    const limit =
        Math.min(
            total,
            500
        );


    for(
        let i = 1;
        i <= limit;
        i++
    ){

        const link =
            document.createElement(
                "a"
            );


        link.className =
            "episode";


        link.textContent =
            String(i)
            .padStart(2,"0");


        link.href =
            "watch.html?id=" +
            animeId +
            "&ep=" +
            i;


        if(i === episode){

            link.classList.add(
                "active"
            );

        }


        episodeGrid.appendChild(
            link
        );

    }

}


/* =========================
   START
========================= */

loadAnime();

</script>


</body>

</html>

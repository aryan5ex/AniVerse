<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>AniVerse</title>

<link
    rel="stylesheet"
    href="style.css">

</head>


<body>


<!-- HEADER -->

<header>

    <div class="logo">
        Ani<span>Verse</span>
    </div>


    <a
        href="menu.html"
        class="menu"
        aria-label="Open Menu">

        &#8942;

    </a>

</header>


<!-- SEARCH -->

<div class="search-area">

    <input
        id="search"
        class="search"
        type="search"
        placeholder="Search anime..."
        autocomplete="off">

</div>


<!-- HERO -->

<div class="hero">

    <div class="hero-content">

        <div class="trending">
            #1 TRENDING
        </div>


        <h1>
            Welcome to AniVerse
        </h1>


        <p>
            Discover anime, latest episodes
            and your favourite series.
        </p>


        <a
            href="#popular"
            class="watch">

            WATCH NOW

        </a>

    </div>

</div>


<!-- POPULAR -->

<section id="popular">

    <div class="heading">

        <h2>
            Popular Anime
        </h2>


        <span>
            Auto
        </span>

    </div>


    <div
        id="animeGrid"
        class="grid">

        <div class="loading">
            Loading popular anime...
        </div>

    </div>

</section>


<!-- LATEST -->

<section>

    <div class="heading">

        <h2>
            Latest Anime
        </h2>


        <span>
            Auto
        </span>

    </div>


    <div
        id="latestGrid"
        class="grid">

        <div class="loading">
            Loading latest anime...
        </div>

    </div>

</section>


<!-- JAVASCRIPT -->

<script src="script.js"></script>


</body>

</html>
